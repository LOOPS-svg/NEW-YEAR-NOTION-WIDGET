
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New Year 2027 | Dark Academia</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #211c18;
  --panel: #2b241e;
  --gold: #c5a77d;
  --cream: #eee1c8;
  --muted: #ad9a7d;
  --line: #65513b;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  padding: 18px;
  display: flex;
  justify-content: center;
  align-items: center;
  background: transparent;
  color: var(--cream);
  font-family: 'Cormorant Garamond', serif;
}

.widget {
  width: 100%;
  max-width: 650px;
  padding: 30px;
  position: relative;
  overflow: hidden;
  background:
    radial-gradient(ellipse at top, #443527 0%, transparent 65%),
    var(--bg);
  border: 1px solid var(--line);
  border-radius: 5px;
  box-shadow: 0 12px 45px rgba(0,0,0,.25);
}

.widget::before {
  content: "";
  position: absolute;
  inset: 8px;
  border: 1px solid rgba(197,167,125,.25);
  pointer-events: none;
}

.topline {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  color: var(--gold);
  font-size: 12px;
  letter-spacing: 3px;
  text-transform: uppercase;
}

.header {
  text-align: center;
  padding: 32px 0 24px;
}

.ornament {
  color: var(--gold);
  letter-spacing: 8px;
  font-size: 17px;
}

h1 {
  font-family: 'Playfair Display', serif;
  font-size: clamp(34px, 8vw, 54px);
  font-weight: 500;
  font-style: italic;
  margin: 12px 0 2px;
  color: var(--cream);
}

.subtitle {
  color: var(--muted);
  letter-spacing: 4px;
  font-size: 12px;
  text-transform: uppercase;
}

.year {
  font-family: 'Playfair Display', serif;
  font-size: clamp(54px, 12vw, 82px);
  color: var(--gold);
  letter-spacing: 8px;
  margin-top: 14px;
  line-height: 1.1;
}

.description {
  color: var(--muted);
  font-size: 17px;
  font-style: italic;
  margin-top: 8px;
}

.countdown {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  margin: 12px 0 28px;
}

.time-box {
  background: rgba(255,255,255,.045);
  border: 1px solid rgba(197,167,125,.2);
  padding: 15px 5px;
  text-align: center;
}

.number {
  font-family: 'Playfair Display', serif;
  font-size: clamp(28px, 6vw, 43px);
  color: var(--cream);
  line-height: 1.2;
  font-variant-numeric: tabular-nums;
}

.label {
  margin-top: 7px;
  font-size: 10px;
  letter-spacing: 2px;
  color: var(--gold);
}

.section-heading {
  display: flex;
  justify-content: space-between;
  color: var(--gold);
  font-size: 12px;
  letter-spacing: 2px;
  text-transform: uppercase;
  gap: 10px;
}

.track {
  height: 9px;
  background: #514333;
  margin-top: 12px;
  border-radius: 20px;
  overflow: hidden;
}

.progress {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #9c7950, #e1c18e);
  transition: width .5s ease;
  border-radius: 20px;
}

.progress-info {
  display: flex;
  justify-content: space-between;
  color: var(--muted);
  font-size: 14px;
  margin-top: 8px;
}

.quote {
  text-align: center;
  margin-top: 30px;
  padding-top: 20px;
  border-top: 1px solid var(--line);
  font-family: 'Playfair Display', serif;
  font-style: italic;
  font-size: 19px;
  color: var(--cream);
  line-height: 1.5;
}

.quote-author {
  font-family: 'Cormorant Garamond', serif;
  font-size: 12px;
  font-style: normal;
  color: var(--gold);
  letter-spacing: 3px;
  margin-top: 8px;
  text-transform: uppercase;
}

.footer {
  text-align: center;
  margin-top: 24px;
  font-size: 10px;
  color: var(--muted);
  letter-spacing: 3px;
}

@media (max-width: 430px) {
  .widget {
    padding: 20px 15px;
  }

  .countdown {
    gap: 6px;
  }

  .time-box {
    padding: 12px 2px;
  }

  .label {
    font-size: 8px;
    letter-spacing: 1px;
  }

  .topline {
    font-size: 9px;
    letter-spacing: 1.5px;
  }
}
</style>
</head>

<body>

<div class="widget">

  <div class="topline">
    <span>✦ Chapter 2027</span>
    <span>01 January ✦</span>
  </div>

  <div class="header">
    <div class="ornament">✧ ❦ ✧</div>
    <h1>Tempus Fugit</h1>
    <div class="subtitle">Time Flies · Make It Count</div>
    <div class="year">2027</div>
    <div class="description">A new chapter awaits...</div>
  </div>

  <div class="countdown">
    <div class="time-box">
      <div class="number" id="days">000</div>
      <div class="label">DAYS</div>
    </div>
    <div class="time-box">
      <div class="number" id="hours">00</div>
      <div class="label">HOURS</div>
    </div>
    <div class="time-box">
      <div class="number" id="minutes">00</div>
      <div class="label">MINUTES</div>
    </div>
    <div class="time-box">
      <div class="number" id="seconds">00</div>
      <div class="label">SECONDS</div>
    </div>
  </div>

  <div class="section-heading">
    <span>2026 · Annual Journey</span>
    <span id="percentage">0%</span>
  </div>

  <div class="track">
    <div class="progress" id="progress"></div>
  </div>

  <div class="progress-info">
    <span id="elapsed">Journey in progress</span>
    <span>2027 →</span>
  </div>

  <div class="quote">
    "The future depends on what you do today."
    <div class="quote-author">— Your New Beginning</div>
  </div>

  <div class="footer">
    ✦ DREAM · PLAN · ACHIEVE ✦
  </div>

</div>

<script>
(function () {
  // India Standard Time: UTC+05:30
  const start = Date.parse("2026-01-01T00:00:00+05:30");
  const target = Date.parse("2027-01-01T00:00:00+05:30");

  const $ = id => document.getElementById(id);

  function update() {
    const now = Date.now();
    const remaining = Math.max(0, target - now);

    const days = Math.floor(remaining / 86400000);
    const hours = Math.floor((remaining % 86400000) / 3600000);
    const minutes = Math.floor((remaining % 3600000) / 60000);
    const seconds = Math.floor((remaining % 60000) / 1000);

    $("days").textContent = String(days).padStart(3, "0");
    $("hours").textContent = String(hours).padStart(2, "0");
    $("minutes").textContent = String(minutes).padStart(2, "0");
    $("seconds").textContent = String(seconds).padStart(2, "0");

    const progress = Math.min(
      100,
      Math.max(0, ((now - start) / (target - start)) * 100)
    );

    $("progress").style.width = progress.toFixed(5) + "%";
    $("percentage").textContent = progress.toFixed(2) + "%";

    $("elapsed").textContent =
      progress >= 100 ? "A new chapter has begun!" :
      progress.toFixed(1) + "% of 2026 completed";

    if (remaining === 0) {
      $("days").textContent = "000";
      $("hours").textContent = "00";
      $("minutes").textContent = "00";
      $("seconds").textContent = "00";
    }
  }

  update();
  setInterval(update, 1000);
})();
</script>

</body>
</html>
